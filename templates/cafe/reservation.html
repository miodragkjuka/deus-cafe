{% extends 'base.html' %}
{% block title %}Резервација{% endblock %}
{% block content %}
<div class="page-head"><div class="wrap">
  <p class="breadcrumb"><a href="{% url 'home' %}">Почетна</a> / Резервација</p>
  <h1>Резервација на маса</h1>
  <p>Оставете ги податоците и ќе ве контактираме за потврда.</p>
</div></div>
<div class="wrap form-layout single">
  <form method="post" novalidate>{% csrf_token %}
    {% for f in form %}<div class="field">{{ f.label_tag }}{{ f }}{{ f.errors }}</div>{% endfor %}
    <button class="btn lg" type="submit">Резервирај</button>
  </form>
</div>
{% endblock %}
